name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger manually from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fox-feather build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hetzner via SFTP (lftp mirror)
        env:
          SFTP_HOST: ${{ secrets.HETZNER_HOST }}
          SFTP_USER: ${{ secrets.HETZNER_USER }}
          LFTP_PASSWORD: ${{ secrets.HETZNER_PASS }}
          SFTP_PATH: ${{ secrets.HETZNER_PATH }}
        run: |
          lftp \
            -u "$SFTP_USER" --env-password \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; mirror -R --parallel=4 --verbose ./artifacts/fox-feather/dist/public/ \"$SFTP_PATH\"; bye" \
            "sftp://$SFTP_HOST"
